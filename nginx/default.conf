# Виртуальный хост eakramar.ru.
# HTTP отдаёт ACME-challenge для Let's Encrypt и редиректит остальное на HTTPS.
# HTTPS отдаёт статику.

server {
    listen 80;
    server_name eakramar.ru www.eakramar.ru;

    # webroot для certbot: сюда он кладёт проверочный файл,
    # nginx отдаёт его Let's Encrypt по HTTP. Метод webroot вместо
    # плагина nginx, потому что плагин не работает через границу контейнера
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # всё остальное — на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name eakramar.ru www.eakramar.ru;

    # сертификаты монтируются с хоста (путь А) либо из тома certbot.
    # На обкатке виртуалки — самоподписанный из scripts/gen-cert.sh
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS включаем ТОЛЬКО на боевом домене с настоящим сертификатом.
    # На стенде с самоподписанным закомментировано
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # отдать файл, иначе 404
    location / {
        try_files $uri $uri/ =404;
    }

    # долгий кэш для статики, чтобы браузер не перезапрашивал
    location ~* \.(css|js|woff2?|ttf|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # резюме отдаём на скачивание/просмотр
    location = /rezume-kramar.pdf {
        add_header Content-Disposition "inline";
    }
}
