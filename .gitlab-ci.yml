stages:
  - build
  - scan
  - deploy

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --provenance=false -t $IMAGE .
    - docker save $IMAGE -o image.tar
    - docker push $IMAGE
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --input image.tar --severity HIGH,CRITICAL --exit-code 0
  dependencies:
    - build

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - chmod 600 "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - ssh-keyscan 94.183.155.135 >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - rsync -az --delete --exclude '.git' --exclude 'certs' --exclude 'certbot-webroot'
        -e "ssh -i $SSH_PRIVATE_KEY"
        ./ eakramar@94.183.155.135:/opt/eakramar-site/
    - ssh -i "$SSH_PRIVATE_KEY" eakramar@94.183.155.135
        "cd /opt/eakramar-site && docker compose up -d --build"
  only:
    - ci-cd