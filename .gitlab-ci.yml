stages:
  - build
  - scan

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --provenance=false -t $IMAGE .
    - docker save $IMAGE -o image.tar
    - docker push $IMAGE
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

scan:
  stage: scan
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker run --rm -v $(pwd):/work aquasec/trivy image --input /work/image.tar --severity HIGH,CRITICAL --exit-code 0