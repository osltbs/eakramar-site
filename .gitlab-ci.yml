stages:
  - build
  - scan
  - deploy

build:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --provenance=false -t $IMAGE -t $CI_REGISTRY_IMAGE:latest .
    - docker save $IMAGE -o image.tar
    - docker push $IMAGE
    - docker push $CI_REGISTRY_IMAGE:latest
  artifacts:
    paths: [image.tar]
    expire_in: 1 hour

scan:
  stage: scan
  image:
    name: aquasec/trivy:0.58.0
    entrypoint: [""]
  script:
    - trivy image --input image.tar --severity HIGH,CRITICAL --exit-code 1
  dependencies:
    - build
  allow_failure: true

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - scp -i ~/.ssh/deploy_key compose.yaml "$DEPLOY_USER@$DEPLOY_HOST:/opt/eakramar-site/"
    - ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "echo \"$REGISTRY_TOKEN\" | docker login -u \"$REGISTRY_USER\" --password-stdin \"$REGISTRY_HOST\" && cd /opt/eakramar-site && REGISTRY_HOST=$REGISTRY_HOST TAG=$CI_COMMIT_SHORT_SHA docker compose pull && REGISTRY_HOST=$REGISTRY_HOST TAG=$CI_COMMIT_SHORT_SHA docker compose up -d"
  only:
    - main