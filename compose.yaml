# Сайт-визитка eakramar.ru.
#
# На обкатке (виртуалка): сертификат самоподписанный из scripts/gen-cert.sh,
#   лежит в ./certs, монтируется в nginx.
# На бою (VPS, путь А): сертификаты Let's Encrypt с хоста монтируются
#   в /etc/nginx/certs — см. закомментированный блок.

services:
  web:
    build: .
    image: eakramar-site:latest
    container_name: eakramar-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          memory: 128M

# Тома не нужны — статика в образе, сертификаты и challenge через bind mount.
